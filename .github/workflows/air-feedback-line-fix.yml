name: Apply architecture feedback-line fix

on:
  push:
    branches:
      - agent/fix-architecture-feedback-line
    paths:
      - .github/workflows/air-feedback-line-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-architecture-feedback-line
          fetch-depth: 0

      - name: Reroute feedback line below context box
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/how-it-works.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              '<svg viewBox="0 0 900 330" role="img" aria-label="AIR prompt-runtime architecture" style="min-width:720px">',
              '<svg viewBox="0 0 900 340" role="img" aria-label="AIR prompt-runtime architecture" style="min-width:720px">',
              'architecture viewBox height'
            ),
            (
              '<text class="d-txt sm" x="785" y="246" text-anchor="middle" font-size="10.5">response / tool proposal</text>',
              '<text class="d-txt sm" x="785" y="320" text-anchor="middle" font-size="10.5">response / tool proposal</text>',
              'response label position'
            ),
            (
              '<polyline points="785,204 785,226 305,226 305,204" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 5"/>',
              '<polyline points="785,204 785,292 305,292 305,204" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 5"/>',
              'feedback loop route'
            ),
            (
              '<text class="d-txt sm" x="545" y="250" text-anchor="middle" font-size="10">tool results return through the host</text>',
              '<text class="d-txt sm" x="545" y="320" text-anchor="middle" font-size="10">tool results return through the host</text>',
              'tool-results label position'
            )
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit fix
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "public/how-it-works.html"
          grep -Fq 'viewBox="0 0 900 340"' public/how-it-works.html
          grep -Fq 'points="785,204 785,292 305,292 305,204"' public/how-it-works.html
          grep -Fq 'x="545" y="320"' public/how-it-works.html
          grep -Fq 'x="785" y="320"' public/how-it-works.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/how-it-works.html
          git commit -m "Reroute architecture feedback line below text"
          git push origin HEAD:agent/fix-architecture-feedback-line
