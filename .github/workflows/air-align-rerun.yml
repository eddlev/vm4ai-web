name: AIR 2.4.3 baseline alignment runner

on:
  push:
    branches:
      - air-243-alignment-rerun
    paths:
      - .github/workflows/air-align-rerun.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: air-243-alignment-rerun
          fetch-depth: 0
      - name: Apply Product Marketing and SFV alignment
        run: python3 .github/air_243_site_align.py
      - name: Verify and commit clean candidate
        run: |
          set -euo pipefail
          BASE=fca17ec14559f47138ab564b410b2b58a55fe420
          git diff --check "$BASE" -- public
          git diff --exit-code "$BASE" -- public/index.html
          rm -f .github/air_243_site_align.py
          rm -f .github/workflows/air-align-rerun.yml
          changed_files="$(git diff --name-only "$BASE")"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -E -v '^(public/(404|about|air-docs|blog|built-with-air|from-morphic-to-air|get-started|glossary|how-it-works|made-with-air|privacy|real-boot-vs-roleplay|recovered-with-air|services|showcase|terms|use-cases)\.html)?$' | grep -q .; then
            echo "Unexpected final diff target" >&2
            exit 1
          fi
          git config user.name "AIR alignment rerun"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align secondary pages to AIR 2.4.3 from trusted baseline"
          git push origin HEAD:air-243-alignment-rerun
