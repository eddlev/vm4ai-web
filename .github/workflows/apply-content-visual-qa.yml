name: Apply content and visual QA

on:
  push:
    paths:
      - '.github/workflows/apply-content-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved content and visual QA patch
        run: python3 tools/apply_content_visual_qa.py

      - name: Validate content and visual system
        run: python3 tools/validate_visual_system.py

      - name: Validate site navigation contract
        run: python3 tools/validate_navigation.py

      - name: Restrict generated diff
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(public/use-cases\.html|public/glossary\.html|public/testing-and-evidence\.html|public/air-v2\.css)$'
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'No generated changes.'
            exit 0
          fi
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected files changed:'
            echo "$bad"
            exit 1
          fi

      - name: Commit validated public changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/use-cases.html public/glossary.html public/testing-and-evidence.html public/air-v2.css
          git commit -m 'Apply content and visual QA'
          git push
