name: AIR v0.4 site align runner
on:
  push:
    branches:
      - agent/air-v0.4-site-alignment
    paths:
      - .github/workflows/air-v04-site-align-run.yml
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/air-v0.4-site-alignment
          fetch-depth: 0
      - name: Apply and validate alignment
        run: python3 .github/air_v04_site_align.py
      - name: Commit repaired site
        run: |
          rm -f .github/air_v04_site_align.py
          rm -f .github/workflows/air-v04-site-audit.yml
          rm -f .github/workflows/air-v04-site-align.yml
          rm -f .github/workflows/air-v04-site-align-run.yml
          git config user.name "AIR repair workflow"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align vm4ai.com with AIR v2.4 public contract"
          git push origin HEAD:agent/air-v0.4-site-alignment
