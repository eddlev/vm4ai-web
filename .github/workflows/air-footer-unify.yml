name: AIR footer normalization

on:
  push:
    branches:
      - air-footer-unify
    paths:
      - .github/workflows/air-footer-unify.yml

permissions:
  contents: write

jobs:
  normalize-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: air-footer-unify
          fetch-depth: 0

      - name: Normalize every public HTML footer from About
        run: python .github/air_footer_unify.py

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "No footer differences found."
          fi
          bad="$(printf '%s\n' "$changed" | grep -vE '^public/[^/]+\.html$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected changed paths:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Remove one-shot execution files
        run: |
          rm .github/air_footer_unify.py
          rm .github/workflows/air-footer-unify.yml

      - name: Commit normalized footers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EddLev | VM4AI"
          git config user.email "contact@vm4ai.com"
          git add -A
          git diff --cached --check
          git commit -m "Unify site footer from About page"
          git push origin HEAD:air-footer-unify
