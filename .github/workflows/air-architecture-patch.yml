name: Apply AIR architecture website patch

on:
  push:
    branches:
      - agent/clarify-air-architecture
    paths:
      - .github/workflows/air-architecture-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/clarify-air-architecture
          fetch-depth: 0

      - name: Apply approved How it works changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/how-it-works.html')
          text = path.read_text(encoding='utf-8')

          marker = '''  </section>\n\n  <section class="section" style="padding-top:1rem">'''
          architecture = '''  </section>\n\n  <section class="section" id="architecture" style="padding-top:2rem">\n    <div class="container">\n      <div class="section-head">\n        <span class="eyebrow">Architecture</span>\n        <h2>Where AIR actually sits.</h2>\n        <p>AIR does not wait for the model to generate a raw answer and then rewrite it. In the prompt-based version, AIR is loaded into the model's context before inference begins.</p>\n      </div>\n      <div class="diagram">\n        <svg viewBox="0 0 900 330" role="img" aria-label="AIR prompt-runtime architecture">\n          <rect class="d-surface" x="30" y="118" width="135" height="62" rx="10" stroke-width="1.5"/>\n          <text class="d-txt" x="97.5" y="143" text-anchor="middle" font-size="14">User</text>\n          <text class="d-txt sm" x="97.5" y="162" text-anchor="middle" font-size="10.5">request</text>\n\n          <rect class="d-frame" x="215" y="96" width="180" height="106" rx="12" stroke-width="2"/>\n          <text class="d-txt" x="305" y="126" text-anchor="middle" font-size="14">Host application</text>\n          <text class="d-txt sm" x="305" y="148" text-anchor="middle" font-size="10.5">ChatGPT · Claude · Gemini</text>\n          <text class="d-txt sm" x="305" y="169" text-anchor="middle" font-size="10.5">assembles context</text>\n\n          <rect class="d-surface" x="445" y="34" width="205" height="230" rx="12" stroke-width="1.5"/>\n          <text class="d-txt" x="547.5" y="65" text-anchor="middle" font-size="14">Model input context</text>\n          <text class="d-txt sm" x="547.5" y="93" text-anchor="middle" font-size="10.5">AIR runtime</text>\n          <text class="d-txt sm" x="547.5" y="116" text-anchor="middle" font-size="10.5">project state + active artifact</text>\n          <text class="d-txt sm" x="547.5" y="139" text-anchor="middle" font-size="10.5">conversation</text>\n          <text class="d-txt sm" x="547.5" y="162" text-anchor="middle" font-size="10.5">sources + tool results</text>\n          <text class="d-txt sm" x="547.5" y="185" text-anchor="middle" font-size="10.5">current user request</text>\n          <line x1="472" y1="207" x2="623" y2="207" stroke="var(--border-strong)" stroke-width="1"/>\n          <text class="d-txt sm" x="547.5" y="232" text-anchor="middle" font-size="10.5">AIR is already here</text>\n\n          <rect x="700" y="96" width="170" height="106" rx="12" fill="color-mix(in srgb,var(--ember) 12%,var(--surface-2))" stroke="var(--ember)" stroke-width="2"/>\n          <text class="d-txt" x="785" y="126" text-anchor="middle" font-size="14">Host model</text>\n          <text class="d-txt sm" x="785" y="149" text-anchor="middle" font-size="10.5">interprets the combined</text>\n          <text class="d-txt sm" x="785" y="168" text-anchor="middle" font-size="10.5">context and generates</text>\n\n          <polyline points="165,149 213,149" class="d-arrow" stroke-width="2"/>\n          <path d="M204 144 L213 149 L204 154 Z" class="d-fill"/>\n          <polyline points="395,149 443,149" class="d-arrow" stroke-width="2"/>\n          <path d="M434 144 L443 149 L434 154 Z" class="d-fill"/>\n          <polyline points="650,149 698,149" class="d-arrow" stroke-width="2"/>\n          <path d="M689 144 L698 149 L689 154 Z" class="d-fill"/>\n\n          <text class="d-txt sm" x="785" y="246" text-anchor="middle" font-size="10.5">response / tool proposal</text>\n          <polyline points="785,204 785,226 305,226 305,204" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 5"/>\n          <text class="d-txt sm" x="545" y="250" text-anchor="middle" font-size="10">tool results return through the host</text>\n        </svg>\n      </div>\n      <div class="cards" style="margin-top:1.2rem">\n        <div class="card">\n          <div class="k">What AIR controls</div>\n          <h3>The working contract</h3>\n          <p>AIR narrows scope, binds the active task, defines allowed and forbidden actions, establishes evidence and approval requirements, and sets review and closure conditions. Adaptive controls such as selected vectors, the synthetic benchmark, geometry and lambda pressure describe how AIR is asking the host model to approach the task.</p>\n        </div>\n        <div class="card">\n          <div class="k">What AIR does not claim</div>\n          <h3>No hidden-model telemetry</h3>\n          <p>These controls are not measurements of chain-of-thought, neural activations or latent-space geometry. AIR objects expose AIR's declared state and the controls applied to the delivered work. Claims that something happened outside the prompt runtime require source, tool, operator or backend evidence.</p>\n        </div>\n        <div class="card">\n          <div class="k">Assurance boundary</div>\n          <h3>Behavioral control, not deterministic enforcement</h3>\n          <p>The host model still interprets the contract, so prompt AIR can materially shape behavior without guaranteeing perfect application. A host adapter, gateway or backend can strengthen the same contract by independently running tests, validating permissions, intercepting tool calls, capturing receipts and rejecting forbidden actions.</p>\n        </div>\n        <div class="card">\n          <div class="k">The important distinction</div>\n          <h3>AIR shapes generation before it happens</h3>\n          <p>The model does not first produce a separate raw answer for AIR to post-process. AIR is part of the context used during inference, so the delivered response is generated under the AIR contract from the start.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class="section" style="padding-top:1rem">'''

          old_handoff = '''          <p>Each session ends with a strict-JSON handoff card. The next session boots from it — so a project survives context limits and resumes exactly where it left off. Because that card is a complete, portable snapshot of your project, treat it like sensitive data — <a href="https://github.com/eddlev/vm4ai-air-kit/discussions/2" target="_blank" rel="noopener">see the threat model</a>.</p>'''
          new_handoff = '''          <p>Each session can produce a strict-JSON Handoff Card that carries the recorded project state into another session or compatible model. The receiving AIR runtime validates the card, restores the active task and working contract, and continues without requiring the whole conversation to be retaught. The host model still interprets that contract, so portability preserves project state — not byte-for-byte identical inference. Because the card is a portable snapshot of your project, treat it like sensitive data — <a href="https://github.com/eddlev/vm4ai-air-kit/discussions/2" target="_blank" rel="noopener">see the threat model</a>.</p>'''

          old_evidence_intro = '''        <p class="sub" style="max-width:45rem">None of this is narrated into being — it is emitted as formal objects you can inspect. The first thing a real session prints:</p>'''
          new_evidence_intro = '''        <p class="sub" style="max-width:45rem">AIR objects are inspectable governance records. They record what AIR selected, required, allowed, blocked, assumed and delivered for the current work. Contract fields describe AIR's declared state; claims about the external world require the corresponding source, tool, operator or backend evidence. The first thing a real session prints:</p>'''

          old_evidence_close = '''      <p style="max-width:45rem">A model performing AIR writes <em>about</em> these objects; a model running AIR <em>emits</em> them. <a href="showcase.html">See a full session &rarr;</a> — a real project from boot to handoff, every object — or learn <a href="real-boot-vs-roleplay.html">how to tell a real boot from a roleplay</a>.</p>'''
          new_evidence_close = '''      <p style="max-width:45rem">These objects make AIR's declared runtime state visible; they do not reveal hidden chain-of-thought or independently prove that an external action occurred. Source-dependent and execution-dependent claims require their own evidence. <a href="showcase.html">See a full session &rarr;</a> — a real project from boot to handoff, every object — or learn <a href="real-boot-vs-roleplay.html">how to tell a real boot from a roleplay</a>.</p>'''

          replacements = [
              (marker, architecture, 'architecture insertion'),
              (old_handoff, new_handoff, 'handoff wording'),
              (old_evidence_intro, new_evidence_intro, 'evidence introduction'),
              (old_evidence_close, new_evidence_close, 'evidence close'),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit patch
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "public/how-it-works.html"
          grep -Fq "Where AIR actually sits." public/how-it-works.html
          grep -Fq "Behavioral control, not deterministic enforcement" public/how-it-works.html
          grep -Fq "portability preserves project state — not byte-for-byte identical inference" public/how-it-works.html
          grep -Fq "they do not reveal hidden chain-of-thought" public/how-it-works.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/how-it-works.html
          git commit -m "Clarify AIR prompt-runtime architecture [air-patched]"
          git push origin HEAD:agent/clarify-air-architecture
